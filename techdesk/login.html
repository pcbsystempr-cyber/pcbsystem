<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso · PCB TechDesk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css"></head>
<body><div class="grid-bg"></div><div id="demoBanner" class="demo-banner hidden">MODO DEMOSTRACIÓN · usa cualquier correo/contraseña. El rol seleccionado determina el panel.</div><div class="auth-wrap"><div class="card auth-card"><a class="brand" href="index.html"><div class="brand-mark">PCB</div><div><strong>PCB TechDesk 2.2</strong><span>Centro de servicio técnico</span></div></a><h1>Acceso seguro</h1><p>Selecciona el tipo de cuenta e inicia sesión con el usuario y la contraseña correspondientes.</p><div class="role-switch"><button id="roleAdmin" type="button">Administrador</button><button id="roleTech" type="button" class="active">Técnico</button></div><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" required autocomplete="username" placeholder="usuario@escuela.pr"></div><div class="field" style="margin-top:13px"><label>Contraseña</label><input id="password" type="password" required autocomplete="current-password" placeholder="••••••••"></div><div id="loginError" class="notice error hidden" style="margin-top:14px"></div><button class="btn btn-primary" id="loginBtn" type="submit" style="width:100%;margin-top:18px">Entrar como técnico</button></form><div style="margin-top:18px;text-align:center"><a href="index.html" style="color:var(--muted);font-size:12px;text-decoration:none">← Volver a crear una boleta</a></div></div></div>
<script type="module">
import { DEMO_MODE, signIn, getSession } from './assets/db.js';import { qs } from './assets/utils.js';
if(DEMO_MODE)qs('#demoBanner').classList.remove('hidden');let role='technician';
function setRole(r){role=r;qs('#roleTech').classList.toggle('active',r==='technician');qs('#roleAdmin').classList.toggle('active',r==='admin');qs('#loginBtn').textContent=r==='admin'?'Entrar como administrador':'Entrar como técnico'}
qs('#roleAdmin').onclick=()=>setRole('admin');qs('#roleTech').onclick=()=>setRole('technician');
getSession().then(s=>{if(s)location.href='app.html'}).catch(()=>{});
qs('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=qs('#loginBtn'),err=qs('#loginError');err.classList.add('hidden');b.disabled=true;b.textContent='Verificando…';try{await signIn(qs('#email').value,qs('#password').value,role);location.href='app.html'}catch(x){err.textContent=x.message||'No se pudo iniciar sesión.';err.classList.remove('hidden')}finally{b.disabled=false;b.textContent=role==='admin'?'Entrar como administrador':'Entrar como técnico'}})
</script></body></html>
